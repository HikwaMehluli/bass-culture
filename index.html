.back h2{position:relative;margin:0;font-size:30px;line-height:.95;font-weight:900;letter-spacing:-.5px}
.back h3{position:relative;margin:4px 0 0;font-size:13px;font-weight:700}
.back p{position:relative;margin:auto 0 8px;font-size:9px;line-height:1.4;color:#cbbba3;max-width:150px}
.back .row{position:relative;display:flex;align-items:flex-end;justify-content:space-between}
.back .brand{font-size:15px;font-weight:800}
.bar{width:74px;height:34px;background:#fff;padding:3px;box-sizing:border-box}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#000 0 1px,#fff 1px 3px,#000 3px 5px,#fff 5px 6px,#000 6px 7px,#fff 7px 10px)}
.back:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(245deg,rgba(255,255,255,.26),transparent 35%);border:2px solid rgba(255,255,255,.18)}
.spine{width:22px;height:300px;left:139px;top:0;transform:rotateY(-90deg) translateZ(150px);background:linear-gradient(90deg,#141210,#231d18 50%,#0e0c0b);display:flex;align-items:center;justify-content:center;border-left:2px solid rgba(255,255,255,.2)}
.spine span{transform:rotate(90deg);white-space:nowrap;color:#f1e7d6;font-weight:900;font-size:12px;letter-spacing:1px}
.spine b{font-weight:500;font-size:9px;margin-left:8px;color:#d6a94b}
.edge{width:22px;height:300px;left:139px;top:0;transform:rotateY(90deg) translateZ(150px);background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(30,30,30,.9))}
.top,.bot{width:300px;height:22px;left:0;top:139px;background:linear-gradient(rgba(255,255,255,.3),rgba(30,30,30,.85))}
.top{transform:rotateX(90deg) translateZ(150px)}
.bot{transform:rotateX(-90deg) translateZ(150px)}
.shadow{position:absolute;left:50%;bottom:2px;width:300px;height:40px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);pointer-events:none}
.stagewrap{position:relative;margin-top:16px}
nav{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;justify-content:center}
button{background:var(--btn);color:var(--ink);border:1px solid rgba(128,110,90,.4);border-radius:999px;padding:9px 18px;font:600 13px inherit;font-family:inherit;cursor:pointer}
button:hover{border-color:var(--ink)}button:focus-visible{outline:2px solid #d6a94b;outline-offset:2px}
.player{display:flex;align-items:center;gap:10px;margin-top:6px;padding:8px 14px;border-radius:999px;background:var(--btn);border:1px solid rgba(128,110,90,.4)}
.player button,.player a{width:36px;height:36px;padding:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--ink);border:1px solid rgba(128,110,90,.4);cursor:pointer;text-decoration:none}
.player button:hover,.player a:hover{border-color:var(--ink)}
.player svg{width:16px;height:16px;fill:currentColor}
.vol{display:flex;align-items:center;gap:6px;color:var(--mute)}
.vol input{width:84px;accent-color:#d6a94b}
.player a:focus-visible,.vol input:focus-visible{outline:2px solid #d6a94b;outline-offset:2px}
.msg{margin-top:8px;font-size:12px;color:var(--mute);min-height:14px}
.player{flex-direction:column;align-items:stretch;gap:8px;border-radius:26px;width:min(92vw,360px);box-sizing:border-box}
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seek{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.seek span{min-width:34px}.seek span:last-child{text-align:right}
#seek{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;margin:0;cursor:pointer;background:linear-gradient(90deg,#d6a94b var(--p,0%),rgba(128,110,90,.4) var(--p,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#f1e7d6;border:2px solid #d6a94b}
#seek::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#f1e7d6;border:2px solid #d6a94b}
#seek:disabled{opacity:.45;cursor:default}
#seek:focus-visible{outline:2px solid #d6a94b;outline-offset:4px}
small{margin-top:12px;color:var(--mute);font-size:12px}
@media (prefers-reduced-motion:reduce){.case{transition:none}}
</style></head><body>

<small>Drag to rotate</small>
<script>
const c=document.getElementById('c'),st=document.getElementById('stage');
let rx=-8,ry=-28,d=false,px,py;
function set(){c.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)'}
st.addEventListener('pointerdown',e=>{d=true;px=e.clientX;py=e.clientY;c.classList.add('drag');st.setPointerCapture(e.pointerId)});
st.addEventListener('pointermove',e=>{if(!d)return;ry+=(e.clientX-px)*.6;rx=Math.max(-60,Math.min(60,rx-(e.clientY-py)*.5));px=e.clientX;py=e.clientY;set()});
const up=()=>{d=false;c.classList.remove('drag')};
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{const[a,y]=b.dataset.r.split(',').map(Number);rx=a;ry=Math.round((ry-y)/360)*360+y;set()});

// ---- Player: set TRACK to your song ----
// Option A (easiest): a file in the same GitHub repo, e.g. "bass-culture.mp3"
// Option B: a Dropbox share link, e.g. "https://www.dropbox.com/s/xxxx/song.mp3?dl=0"
const TRACK="bass-culture-amapiano-mix.mp3";
const au=document.getElementById('au'),pp=document.getElementById('pp'),ic=document.getElementById('ic'),msg=document.getElementById('msg'),dl=document.getElementById('dl');
const PLAY='M8 5v14l11-7z',PAUSE='M6 5h4v14H6zM14 5h4v14h-4z';
if(TRACK){
  const u=new URL(TRACK,location.href);
  if(/dropbox\.com$/.test(u.hostname)){
    const d=new URL(u);d.searchParams.set('dl','1');dl.href=d.href;
    u.hostname='dl.dropboxusercontent.com';u.searchParams.delete('dl');u.searchParams.set('raw','1');
    au.src=u.href;
  }else{au.src=u.href;dl.href=u.href;dl.setAttribute('download','')}
}else{dl.removeAttribute('href');dl.style.opacity=.4;msg.textContent='No track linked yet'}
au.volume=.5;
const icon=p=>{ic.firstElementChild.setAttribute('d',p?PAUSE:PLAY);pp.setAttribute('aria-label',p?'Pause':'Play')};
pp.onclick=()=>{if(!TRACK)return;if(au.paused){au.play().catch(()=>msg.textContent='Could not play this track')}else au.pause()};
document.getElementById('stop').onclick=()=>{au.pause();au.currentTime=0};
au.onplay=()=>{icon(true);msg.textContent=''};au.onpause=()=>icon(false);au.onended=()=>icon(false);
document.getElementById('vol').oninput=e=>au.volume=e.target.value/100;

const sk=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur');
let seeking=false;
const fmt=s=>{if(!isFinite(s))return'--:--';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const paint=()=>{const d=au.duration;const t=seeking?+sk.value:au.currentTime;cur.textContent=fmt(t);if(isFinite(d)&&d>0){sk.value=t;sk.style.setProperty('--p',(t/d*100)+'%')}};
au.onloadedmetadata=()=>{sk.max=au.duration;sk.disabled=false;dur.textContent=fmt(au.duration);paint()};
au.ontimeupdate=paint;
au.addEventListener('ended',()=>{sk.value=0;paint()});
au.addEventListener('emptied',()=>{sk.disabled=true;dur.textContent='--:--'});
sk.addEventListener('input',()=>{seeking=true;paint()});
sk.addEventListener('change',()=>{au.currentTime=+sk.value;seeking=false;paint()});
document.getElementById('stop').addEventListener('click',()=>{sk.value=0;paint()});
</script></body></html>
